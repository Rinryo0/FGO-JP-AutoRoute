name: Build Windows Desktop EXE\non:\n  push:\n    branches: [main, master]\n    paths:\n      - 'desktop/**'\n      - '.github/workflows/build-exe.yml'\n      - 'README.md'\n      - '.gitignore'\n  workflow_dispatch:\npermissions:\n  contents: read\njobs:\n  build-windows:\n    runs-on: windows-latest\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Set up Python on cloud builder only\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - name: Install build dependencies\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install -r desktop/requirements.txt \"pyinstaller>=6.10,<7\"\n      - name: Restore native app source and automation engine\n        shell: pwsh\n        run: |\n          Expand-Archive -Path FGO-JP-AutoRoute-v0.3.0-source.zip -DestinationPath .source -Force\n          Copy-Item .source/FGO-JP-AutoRoute/fgoauto desktop/fgoauto -Recurse -Force\n          Copy-Item .source/FGO-JP-AutoRoute/tests desktop/tests -Recurse -Force\n          python -c \"import base64,pathlib; pathlib.Path('desktop/main.py.xz').write_bytes(base64.b64decode(pathlib.Path('desktop/main.py.xz.b64').read_bytes()))\"\n          python -c \"import lzma,pathlib; pathlib.Path('desktop/main.py').write_bytes(lzma.decompress(pathlib.Path('desktop/main.py.xz').read_bytes()))\"\n      - name: Download scrcpy for real-time MuMu mirroring\n        shell: pwsh\n        run: |\n          $version = \"v5.0.1\"\n          $uri = \"https://github.com/Genymobile/scrcpy/releases/download/$version/scrcpy-win64-$version.zip\"\n          New-Item -ItemType Directory -Force -Path desktop/vendor | Out-Null\n          Invoke-WebRequest -Uri $uri -OutFile scrcpy.zip\n          $hash = (Get-FileHash scrcpy.zip -Algorithm SHA256).Hash.ToLower()\n          if ($hash -ne \"b12a2c4ee8be317422451fc7dcf8ee20a71b5ea7ef9ad73ddd825a25316227a5\") { throw \"scrcpy archive SHA-256 mismatch\" }\n          New-Item -ItemType Directory -Force -Path desktop/vendor/scrcpy-temp | Out-Null\n          Expand-Archive -Path scrcpy.zip -DestinationPath desktop/vendor/scrcpy-temp -Force\n          $scrcpyExe = Get-ChildItem desktop/vendor/scrcpy-temp -Filter scrcpy.exe -Recurse | Select-Object -First 1\n          if (!$scrcpyExe) { throw \"scrcpy.exe was not found in the official archive\" }\n          New-Item -ItemType Directory -Force -Path desktop/vendor/scrcpy | Out-Null\n          Copy-Item -Path (Join-Path $scrcpyExe.DirectoryName \"*\") -Destination desktop/vendor/scrcpy -Recurse -Force\n          Remove-Item desktop/vendor/scrcpy-temp -Recurse -Force\n      - name: Check Python syntax and tests\n        run: |\n          python -m compileall -q desktop\n          python -m pip install pytest\n          $env:PYTHONPATH = \"desktop\"\n          python -m pytest -q desktop/tests\n      - name: Build standalone Windows x64 EXE\n        shell: pwsh\n        run: |\n          pyinstaller --noconfirm --clean --onefile --windowed `\n            --name FGO-JP-AutoRoute `\n            --collect-all PIL `\n            --collect-all cv2 `\n            --collect-all numpy `\n            --add-data \"desktop/vendor/scrcpy;scrcpy\" `\n            --paths desktop `\n            desktop/main.py\n      - name: Package downloads\n        shell: pwsh\n        run: |\n          New-Item -ItemType Directory -Force -Path dist | Out-Null\n          Copy-Item README.md dist/README.md\n          Copy-Item desktop/README.md dist/Desktop-README.md\n          $license = Get-ChildItem desktop/vendor/scrcpy -File | Where-Object { $_.Name -match '^LICENSE' } | Select-Object -First 1\n          if (!$license) { throw \"scrcpy license file was not found\" }\n          Copy-Item $license.FullName dist/scrcpy-LICENSE.txt\n          Compress-Archive -Path dist/FGO-JP-AutoRoute.exe,dist/README.md,dist/Desktop-README.md,dist/scrcpy-LICENSE.txt `\n            -DestinationPath dist/FGO-JP-AutoRoute-Windows-x64.zip -Force\n      - name: Upload EXE artifacts\n        uses: actions/upload-artifact@v4\n        with:\n          name: FGO-JP-AutoRoute-Windows-x64\n          path: |\n            dist/FGO-JP-AutoRoute.exe\n            dist/FGO-JP-AutoRoute-Windows-x64.zip\n