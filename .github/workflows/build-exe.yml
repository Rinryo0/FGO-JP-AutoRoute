name: Build Windows Desktop EXE
on:
  push:
    branches: [main, master]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-exe.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python on cloud builder only
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt "pyinstaller>=6.10,<7"
      - name: Check Python syntax
        run: python -m py_compile desktop/main.py
      - name: Build standalone Windows x64 EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name FGO-JP-AutoRoute `
            --collect-all PIL `
            desktop/main.py
      - name: Package downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item README.md dist/README.md
          Copy-Item desktop/README.md dist/Desktop-README.md
          Compress-Archive -Path dist/FGO-JP-AutoRoute.exe,dist/README.md,dist/Desktop-README.md `
            -DestinationPath dist/FGO-JP-AutoRoute-Windows-x64.zip -Force
      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FGO-JP-AutoRoute-Windows-x64
          path: |
            dist/FGO-JP-AutoRoute.exe
            dist/FGO-JP-AutoRoute-Windows-x64.zip
