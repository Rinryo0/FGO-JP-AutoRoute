name: Build Windows EXE
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'FGO-JP-AutoRoute-v0.3.0-source.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for build only
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract uploaded source archive
        shell: pwsh
        run: |
          $archive = "FGO-JP-AutoRoute-v0.3.0-source.zip"
          if (!(Test-Path $archive)) {
            throw "請先將 FGO-JP-AutoRoute-v0.3.0-source.zip 上傳到 Repository 根目錄。"
          }
          Expand-Archive -Path $archive -DestinationPath source -Force
          if (!(Test-Path "source/FGO-JP-AutoRoute/app.py")) {
            throw "ZIP 結構不正確：找不到 source/FGO-JP-AutoRoute/app.py"
          }
      - name: Install build dependencies
        working-directory: source/FGO-JP-AutoRoute
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "pyinstaller>=6.10,<7"
      - name: Run tests
        working-directory: source/FGO-JP-AutoRoute
        run: python -m pytest -q
      - name: Build standalone Windows x64 EXE
        working-directory: source/FGO-JP-AutoRoute
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name FGO-JP-AutoRoute `
            --add-data "web;web" `
            --collect-all cv2 `
            --collect-all numpy `
            --collect-all flask `
            --collect-all werkzeug `
            --collect-all jinja2 `
            --collect-all click `
            --collect-all itsdangerous `
            --collect-all blinker `
            app.py
      - name: Create download packages
        working-directory: source/FGO-JP-AutoRoute
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item ../../FGO-JP-AutoRoute-v0.3.0-source.zip dist/FGO-JP-AutoRoute-Source.zip
          Compress-Archive -Path dist/FGO-JP-AutoRoute.exe,dist/README.md `
            -DestinationPath dist/FGO-JP-AutoRoute-Windows-x64.zip -Force
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FGO-JP-AutoRoute-Windows-x64
          path: |
            source/FGO-JP-AutoRoute/dist/FGO-JP-AutoRoute.exe
            source/FGO-JP-AutoRoute/dist/FGO-JP-AutoRoute-Windows-x64.zip
            source/FGO-JP-AutoRoute/dist/FGO-JP-AutoRoute-Source.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            source/FGO-JP-AutoRoute/dist/FGO-JP-AutoRoute.exe
            source/FGO-JP-AutoRoute/dist/FGO-JP-AutoRoute-Windows-x64.zip
            source/FGO-JP-AutoRoute/dist/FGO-JP-AutoRoute-Source.zip
